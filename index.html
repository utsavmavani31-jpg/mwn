<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Women's Safety Agent — Full React App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body{font-family:Inter, Arial, sans-serif; margin:0; padding:20px; background:#f8fafc; color:#0f172a;}
      .app{max-width:900px;margin:0 auto;}
      .chat{border-radius:8px;padding:12px;background:white;border:1px solid #e2e8f0;}
      .controls{display:flex;gap:8px;margin-top:8px;}
      input{flex:1;padding:8px;border-radius:6px;border:1px solid #cbd5e1;}
      button{padding:8px 12px;border-radius:6px;border:none;background:#2563eb;color:white;cursor:pointer;}
      .panic{background:#dc2626;}
      .modal{position:fixed;inset:0;background:rgba(2,6,23,0.6);display:flex;align-items:center;justify-content:center;}
      .modal .box{background:white;padding:20px;border-radius:8px;max-width:420px;width:100%;}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
